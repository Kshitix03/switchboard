[project]
name = "switchboard"
version = "0.1.0"
description = "Retrieval gated agentic system for 500+ tools"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=0.3.0",
    "qdrant-client>=1.9.0",
    "rank-bm25>=0.2.2",
    "pydantic>=2.7.0",
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0",
    "typer>=0.12.0",
    "python-dotenv>=1.0.0",
    "sentence-transformers>=3.0.0",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "jsonschema>=4.20.0",
    "arize-phoenix>=19.0.0",
    "arize-phoenix-otel>=0.16.0",
    "matplotlib>=3.8.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[tool.setuptools.packages.find]
include = ["registry*", "routing*", "graph*", "tools*", "observability*", "eval*"]
